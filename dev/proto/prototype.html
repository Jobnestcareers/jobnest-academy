<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>JobNest Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600&display=swap">
<style>
/* Layout: matric-number sign-in → student campus (stage rail + working panel) with a first-login guided tour */
:root{
  --bg:#F3F6F6; --surface:#FFFFFF; --surface-2:#E8EEEE; --ink:#0E2A33; --muted:#566B72; --line:#D3DEDF;
  --brand:#0F4C5C; --brand-ink:#FFFFFF; --accent:#E9A23B; --accent-ink:#2B1B02; --accent-soft:#FBEBD2;
  --ok:#2E8B57; --ok-soft:#DDF1E5; --lock:#9AABB0; --danger:#B3402F; --danger-soft:#F8E1DC; --scrim:rgba(8,24,30,.55);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1A1F; --surface:#112830; --surface-2:#163440; --ink:#E6F0F1; --muted:#9DB3B8; --line:#24434D;
  --brand:#5FB3C4; --brand-ink:#06191E; --accent:#F0B357; --accent-ink:#2B1B02; --accent-soft:#3A2A10;
  --ok:#5CC48A; --ok-soft:#173A28; --lock:#5B7178; --danger:#E77A68; --danger-soft:#3B1D18; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1A1F; --surface:#112830; --surface-2:#163440; --ink:#E6F0F1; --muted:#9DB3B8; --line:#24434D;
  --brand:#5FB3C4; --brand-ink:#06191E; --accent:#F0B357; --accent-ink:#2B1B02; --accent-soft:#3A2A10;
  --ok:#5CC48A; --ok-soft:#173A28; --lock:#5B7178; --danger:#E77A68; --danger-soft:#3B1D18; --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,4.2vw,2.6rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 .72rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:999px;padding:.75rem 1.3rem;font-weight:700;background:var(--brand);color:var(--brand-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.gold{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:.45rem .9rem;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.proto{background:var(--ink);color:var(--bg);font-size:.8rem}
.proto .wrap{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:space-between;padding-block:.45rem}
.proto button{background:none;border:0;color:inherit;text-decoration:underline;text-underline-offset:3px;padding:0}
.proto .links{display:flex;gap:1rem;flex-wrap:wrap}

.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.8rem}
.logo{display:flex;align-items:center;gap:.6rem;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.logo svg{flex:none}
.who{display:flex;align-items:center;gap:.5rem;font-size:.85rem;min-width:0}
.chip{display:inline-flex;align-items:center;gap:.5rem;background:var(--surface-2);border:0;color:var(--ink);padding:.3rem .4rem .3rem .3rem;border-radius:999px;font-weight:600;font-size:.82rem}
.chip .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 .75rem var(--f-display)}
.chip .mono{font-size:.75rem}

/* login */
.login{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 34px)}
.login > *{min-width:0}
.login-side{background:var(--brand);color:var(--brand-ink);padding-block:3rem;position:relative;overflow:hidden;display:flex;align-items:center}
.login-side::after{content:"";position:absolute;right:-90px;bottom:-90px;width:320px;height:320px;border-radius:50%;border:40px solid var(--accent);opacity:.3}
.login-side .inner{max-width:460px;margin-left:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:2.5rem;position:relative;z-index:1;display:grid;gap:1.2rem}
.login-side .eyebrow{color:var(--brand-ink);opacity:.75}
.login-side ol{margin:0;padding:0;list-style:none;display:grid;gap:.7rem}
.login-side li{display:grid;grid-template-columns:28px 1fr;gap:.7rem;align-items:start;font-size:.92rem}
.login-side li b{font:700 .78rem/28px var(--f-mono);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);text-align:center}
.login-main{display:flex;align-items:center;padding-block:3rem;padding-left:2.5rem;padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:400px;display:grid;gap:1rem}
.form{display:grid;gap:.9rem}
.field{display:grid;gap:.3rem}
.field label,.field .lbl{font-weight:600;font-size:.85rem}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.65rem .75rem;width:100%}
.field textarea{min-height:88px;resize:vertical}
.field input[readonly],.field textarea[readonly]{background:var(--surface-2)}
.pw{position:relative}
.pw input{padding-right:4.2rem}
.pw button{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--brand);font-weight:700;font-size:.8rem;padding:.4rem}
.err{color:var(--danger);font-size:.85rem;font-weight:600}
.hint{background:var(--accent-soft);border-radius:10px;padding:.75rem .9rem;font-size:.85rem}
.hint .mono{font-weight:700}

/* campus */
.greet{padding-block:1.6rem .4rem;display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap}
.campus{display:grid;grid-template-columns:290px 1fr;gap:1.5rem;padding-block:1rem 3rem;align-items:start}
.campus > *{min-width:0}
.summary{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:center;margin-bottom:1rem;padding:.8rem;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ring{width:64px;height:64px}
.rail{display:grid;gap:.35rem;border-radius:12px}
.stage-btn{display:grid;grid-template-columns:34px 1fr auto;gap:.6rem;align-items:center;text-align:left;padding:.6rem .7rem;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink)}
.stage-btn:hover:not([aria-disabled="true"]){background:var(--surface)}
.stage-btn[aria-current="true"]{background:var(--surface);border-color:var(--line)}
.stage-btn[aria-disabled="true"]{color:var(--lock);cursor:not-allowed}
.stage-btn .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 .85rem var(--f-mono);border:1.5px solid var(--line);background:var(--surface)}
.stage-btn.done .n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stage-btn.now .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stage-btn b{display:block;font-size:.88rem;line-height:1.25}
.stage-btn small{font-size:.72rem;color:var(--muted)}
.stage-btn .lk{font-size:.7rem}

.stage-head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem;display:grid;gap:1rem}
.stage-head .row{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:start}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;border-top:1px solid var(--line);padding-top:1rem;margin:0}
.facts > div{min-width:0}
.facts dt{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:.25rem}
.facts dd{margin:0;font-size:.88rem}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.pill{display:inline-block;font-size:.72rem;font-weight:700;border-radius:99px;padding:.2rem .6rem;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.now{background:var(--accent-soft);color:var(--ink)}

.items{display:grid;gap:.5rem;margin-top:1rem;border-radius:14px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:.8rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;text-align:left;color:var(--ink);width:100%}
.item:hover{border-color:var(--brand)}
.item > div{min-width:0}
.item .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand)}
.item.done .ic{background:var(--ok-soft);color:var(--ok)}
.item b{display:block;font-size:.95rem}
.item small{color:var(--muted);font-size:.78rem}

.view{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem;display:grid;gap:1.1rem}
.back{background:none;border:0;color:var(--brand);font-weight:700;padding:0;justify-self:start}
.video{aspect-ratio:16/9;max-width:100%;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--ink));display:grid;place-items:center;position:relative;overflow:hidden}
.video .play{width:66px;height:66px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);border:0}
.video .cap{position:absolute;left:1rem;bottom:.8rem;font-size:.78rem;color:#fff}
.notes{display:grid;gap:.7rem;max-width:66ch}
.notes ul{margin:0;padding-left:1.2rem;display:grid;gap:.35rem}
.q{display:grid;gap:.5rem;border:0;border-top:1px solid var(--line);margin:0;padding:1rem 0 0}
.q legend{padding:0;margin-bottom:.5rem;font-weight:700}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem .75rem;border:1.5px solid var(--line);border-radius:9px;cursor:pointer}
.opt input{margin-top:3px;accent-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--danger)}
.result{border-radius:12px;padding:1rem 1.2rem;font-weight:600}
.result.pass{background:var(--ok-soft);color:var(--ok)}
.result.fail{background:var(--accent-soft);color:var(--ink)}
.celebrate{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:1rem 1.2rem;display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:1rem}

/* logbook */
.placement{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;background:var(--surface-2);border-radius:12px;padding:1rem}
.placement > div{min-width:0}
.placement dt{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.placement dd{margin:.15rem 0 0;font-weight:600;font-size:.9rem;overflow-wrap:anywhere}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.wk{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:.7rem .8rem;text-align:left;display:grid;gap:.25rem}
.wk b{font-family:var(--f-display);font-size:1rem}
.wk[aria-current="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.wk[disabled]{color:var(--lock);cursor:not-allowed;background:var(--bg)}
.lb-form{display:grid;gap:1rem}
.lb-sec{display:grid;gap:.9rem;border-top:1px solid var(--line);padding-top:1rem}
.lb-sec h3{font-size:1rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.grid2 > *{min-width:0}
.rate{display:flex;gap:.4rem;flex-wrap:wrap}
.rate label{display:grid;place-items:center;min-width:46px;padding:.5rem .6rem;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;font-weight:700;font-size:.85rem}
.rate input{position:absolute;opacity:0;pointer-events:none}
.rate input:checked + span{color:var(--accent-ink)}
.rate label:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rate label:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.signoff{border-radius:12px;padding:1rem;border:1.5px dashed var(--line);display:grid;gap:.5rem}
.signoff.signed{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}

.rail-stage{margin:.9rem 0 .2rem;padding:0 .7rem;font:700 .7rem/1.3 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rail-stage:first-child{margin-top:0}
.rail-stage .mono{color:var(--brand);margin-right:.25rem}
.stage-btn small{display:block}
.about summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--brand)}
.about[open] summary{margin-bottom:.8rem}
.about .facts{padding-top:.8rem}
/* ===== added pages ===== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.appnav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:15}
.appnav .tabs{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
.appnav .tabs::-webkit-scrollbar{display:none}
.appnav button{background:none;border:0;border-bottom:3px solid transparent;padding:.75rem .8rem .6rem;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.appnav button:hover{color:var(--ink)}
.appnav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.bellwrap{position:relative}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);color:var(--ink);display:grid;place-items:center}
.bell .dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:99px;background:var(--danger);color:#fff;font:700 .68rem/18px var(--f-mono);padding:0 4px}
.notifs{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.18);z-index:25;overflow:hidden}
.notifs .nh{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.ni{display:grid;gap:.15rem;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.75rem 1rem;color:var(--ink)}
.ni.unread{background:var(--accent-soft)}
.ni span{font-size:.82rem;color:var(--muted)}.ni small{font-size:.72rem;color:var(--muted)}
.pagebody,.home{display:grid;gap:1.2rem;padding-block:1rem 3rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem;min-width:0}
.card h3{font-size:1.05rem}
.card > h3 + *{margin-top:.7rem}
.ch{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-bottom:.6rem;flex-wrap:wrap}
.ch h3{margin:0}
.stack{display:grid;gap:1.2rem;align-content:start;min-width:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}
.cols.wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.cols > *{min-width:0}
.continue{display:grid;gap:.8rem;border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.continue .row{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;display:grid;gap:.25rem;min-width:0}
.metric b{font-size:1.6rem;line-height:1.1}.metric b.sm{font-size:1.15rem}.metric b small{font-size:.9rem;color:var(--muted)}
.steps,.sched,.journey,.mini,.hist,.posts,.roles,.port,.reqlist,.reqs{list-style:none;margin:0;padding:0;display:grid;gap:.1rem}
.steps li{display:flex;justify-content:space-between;gap:.8rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border:0}
.steps li > div{display:grid;gap:.1rem;min-width:0}
.due.warn{color:var(--ink);font-weight:700}.due.bad{color:var(--danger);font-weight:700}
.sched li{display:grid;grid-template-columns:46px 1fr;gap:.8rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.sched li:last-child{border:0}
.sched li > div{display:grid;min-width:0}
.date{display:grid;place-items:center;border-radius:10px;background:var(--surface-2);padding:.3rem 0;line-height:1.1}
.date b{font:700 1.1rem var(--f-mono)}.date small{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:.1rem .45rem;border-radius:5px;background:var(--surface-2);color:var(--ink)}
.t-Deadline{background:var(--accent-soft)}.t-Milestone{background:var(--ok-soft);color:var(--ok)}
.journey li{display:grid;grid-template-columns:30px 1fr;gap:.7rem;align-items:start;padding:.5rem 0}
.journey li > div{display:grid;min-width:0}
.jd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 .75rem var(--f-mono);border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.journey li.done .jd{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.journey li.cur .jd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.journey li:not(.done):not(.cur) b{color:var(--muted)}
.ann{padding:.6rem 0;border-bottom:1px solid var(--line);display:grid;gap:.2rem}
.mini{margin-top:.7rem;gap:.35rem;font-size:.9rem}.mini li.ok{color:var(--ok)}
.demo{display:inline-block;font:700 .66rem/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:.3rem .5rem;border-radius:5px;border:1px dashed var(--muted);color:var(--muted)}
.notice{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:.8rem 1rem;font-size:.88rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chipf{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:.4rem .8rem;font-weight:600;font-size:.82rem}
.chipf[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.card .tbl-wrap{border:0}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;min-width:560px}
.tbl th{text-align:left;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:.7rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:.7rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td b{display:block}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.cur td{background:var(--accent-soft)}
.tbl.rub{min-width:0}.tbl.rub td:last-child{text-align:right;width:3rem}
.empty{color:var(--muted);font-size:.9rem;padding:.6rem 0}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:.8rem;padding:.45rem 0;font-size:.88rem;border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}

const TRACK_LESSONS = {

       L("Building a simple dashboard",34,["KPIs and filters","Dashboards in Looker Studio or Power BI","Presenting insights in five minutes"],"Bringing it together into a shareable report.")],
  DMK:[L("Marketing fundamentals & the funnel",20,["Awareness, consideration, conversion","Personas and positioning","Setting campaign goals"],"How digital marketing turns attention into customers."),
       L("Content creation with Canva",30,["Brand kits and templates","Carousel and reel formats","Writing captions that convert"],"Producing on-brand content quickly."),

const TRACK_WEEK_TITLES = {

  {title:"Job Search & Personal Pitch",
   objective:"Run an active, high-conversion job search with networking and a polished personal pitch.",
   activities:"Cold outreach, job boards, LinkedIn networking, elevator pitch, interview follow-up.",

   facilitators:"Job Search Coaches, outreach templates, tracking dashboards."}
];

const QUIZ_READINESS = {type:"quiz",title:"Workplace Readiness Quiz",pass:70,qs:[
  {q:"A client emails a question you can't answer yet. What should you do first?",o:["Wait until you have the full answer","Acknowledge the email and give a time you'll reply by","Forward it to your manager without comment","Reply on WhatsApp instead"],a:1},
  {q:"Which file name follows good practice?",o:["final final.docx","report-new(2).docx","2026-11-04_AcmeCo_Onboarding-Guide_v2.docx","Untitled document"],a:2},
  {q:"In a remote team meeting you are not presenting. Best practice is to:",o:["Keep your mic on so people know you're there","Mute and use the raise-hand feature to speak","Turn your camera off and step away","Type everything in the chat"],a:1},
  {q:"In the Eisenhower matrix, a task that is important but not urgent should be:",o:["Done immediately","Delegated","Scheduled","Deleted"],a:2},
  {q:"A Trello card for a deliverable should always have:",o:["A colourful cover image","A due date and a clear owner","At least ten checklist items","A long description of the client"],a:1}]};

/* The programme, week by week. stage = index into STAGES. */
function _buildWeeks(track){
  const tl=TRACK_LESSONS[track], tt=TRACK_WEEK_TITLES[track], pl=PLACEMENT[track];
  const W=(stage,title,items)=>({stage,title,items});
  return [
  W(0,"Welcome & Orientation",[{type:"guide",title:"How to navigate the platform"},{type:"oath",title:"Read & sign the Student Oath"},
     T("Read the Student Handbook","Attendance rules, grading, code of conduct and how to get help."),
     T("Join your cohort community","Introduce yourself: your name, track and one goal for the programme.")]),
  W(1,"Communication & Remote Work",[
     L("Professional communication",18,["Write subject lines that state the ask","Keep emails to one topic and a clear next step","Reply within one working day, even if only to acknowledge","Match formality to the channel: email vs Slack vs WhatsApp"],"How to write and speak so managers and clients trust you."),
     L("Remote work etiquette",15,["Camera on for team meetings unless agreed otherwise","Mute when not speaking; use the raise-hand feature","Update your status when away","Overcommunicate progress and blockers"],"The unwritten rules of working from home with a distributed team."),
     L("File organisation in Google Drive & OneDrive",20,["One top-level folder per client or project","Name files YYYY-MM-DD_Project_Description_v1","Share with links and the right permission level","Never keep work only on your desktop"],"Build a folder system anyone on your team can navigate.")]),
  W(1,"Productivity & Workplace Readiness",[
     L("Time management",16,["Time-block deep work in your calendar","Use the Eisenhower matrix to triage","Estimate tasks, then compare with actual time","Protect a daily shutdown routine"],"Plan your day so deadlines stop surprising you."),
     L("Task tracking with Trello & Notion",22,["Boards with To do, Doing, Review, Done","One card per deliverable with a due date and owner","Checklists for repeatable work","Weekly review of your board"],"Set up a simple system to track every task you own."),
     QUIZ_READINESS,
     {...T("Week project: set up your clean digital workspace","Create your Drive/OneDrive folder structure and a Trello or Notion board. Paste a share link for review.",true),proj:true}]),
  W(2,tt[0],[tl[0],{...T("Week project: "+tt[0],"Complete this week's guided exercise from the masterclass and share a link to your work. Your facilitator grades it with the rubric.",true),proj:true}]),
  W(2,tt[1],[tl[1],{...T("Week project: "+tt[1],"Complete this week's guided exercise from the masterclass and share a link to your work. Your facilitator grades it with the rubric.",true),proj:true}]),
  W(2,tt[2],[tl[2],{...T("Week project: "+tt[2],"Complete this week's guided exercise from the masterclass and share a link to your work. Your facilitator grades it with the rubric.",true),proj:true}]),
  W(2,tt[3],[tl[3],{...T("Week project: module assignment","Bring this month's skills together in the module assignment and submit a link to your work.",true),proj:true},
     T("Technical competency check","A 30-minute practical check with a Domain Expert.")]),
  W(3,"Project: Plan & Build",[T("Read your project brief",PROJECT_BRIEF[track]),
     {...T("Submit your project plan","Share your plan: what you'll deliver, the steps you'll take and your timeline.",true),proj:true},
     T("Check-in with your project supervisor","A 20-minute call to review your plan and early progress.")]),
  W(3,"Project: Delivery",[{...T("Submit your final project","Share a link to your finished project.",true),proj:true},
     T("Self-review against the rubric","Score your own work honestly with the rubric before your supervisor grades it."),
     T("Supervisor grading","Your project supervisor grades your project against the rubric.")]),
  W(4,"Internship · Week 1",[T("Confirm your placement",`Accept your placement at ${pl.org} and meet your supervisor, ${pl.sup}.`),{type:"logweek",wk:1,title:"Logbook entry · Week 1"}]),
  W(4,"Internship · Week 2",[{type:"logweek",wk:2,title:"Logbook entry · Week 2"}]),
  W(4,"Internship · Week 3",[{type:"logweek",wk:3,title:"Logbook entry · Week 3"}]),
  W(4,"Internship · Week 4",[{type:"logweek",wk:4,title:"Logbook entry · Week 4"},
     T("Supervisor performance evaluation","Your supervisor completes your performance scorecard."),
     T("Collect your internship certificate","Issued once your logbook and evaluation are complete.")]),
  W(5,"CV, LinkedIn & Portfolio",[T("ATS-compliant resume","Rebuild your CV with the template and submit for review.",true),

     T("Publish your portfolio","Curate your project and internship work on Canva or Notion.",true)]),
  W(6,"Discovery Call 2",[T("Book your 1-on-1 session","Pick a slot with your Career Mentor."),
     T("Mock interview simulation","A 40-minute interview with feedback against the rubric."),
     T("Finalise your Job Search Action Plan","Target roles, companies and weekly application goals.",true)]),
  W(7,"Personal Pitch & Outreach",[T("Record your elevator pitch","A 60-second video introducing yourself. Share the link.",true),
     T("Send 10 cold outreach messages","Use the templates and log each one.")]),
  W(7,"Applications & Interviews",[T("Weekly job application tracker","Submit your tracker every Friday.",true),
     T("Report your first interview invite","Tell your coach so they can help you prepare.")])
  ];

/* Sample weekly quiz built from the week's lessons */
const BAD_PRACTICE=["Wait until the deadline before sharing any progress","Keep important work only on your personal laptop","Skip checking your work before you send it","Avoid asking questions so you look confident","Reply to messages only when it suits you","Copy a classmate's work and change a few words"];
function weekQuiz(wi,wk){const qs=[];let b=wi;
  wk.items.filter(x=>x.type==="lesson").forEach(l=>l.points.slice(0,l.points.length>3?2:3).forEach(pt=>{const a=(qs.length+wi)%4,o=[];for(let k=0;k<4;k++)o.push(k===a?pt:BAD_PRACTICE[(b++)%BAD_PRACTICE.length]);qs.push({q:`Which of these is good practice from “${l.title}”?`,o,a})}));
  return {type:"quiz",title:`Week ${wi+1} assessment`,pass:70,qs:qs.slice(0,5)}}
/* Week objectives, resources and optional extras (sample content) */
const _wkCache={};
function buildWeeks(track){
  if(_wkCache[track])return _wkCache[track];
  const ws=_buildWeeks(track), tl=TRACK_LESSONS[track];
  const OBJ={
    1:["Write clear, professional emails and messages","Follow remote meeting etiquette","Organise your files in Google Drive or OneDrive"],
    2:["Plan your week with time-blocking","Track your tasks on a Trello or Notion board","Pass the Workplace Readiness Quiz"],
    7:["Understand your client's brief","Plan your project with clear steps and a timeline","Get early feedback from your project supervisor"],
    8:["Deliver complete, professional work","Review your own work against the rubric","Reflect on what you'd do differently"],
    13:["Rebuild your CV so it passes ATS filters","Rewrite your LinkedIn headline and About section","Publish a portfolio of your best work"],
    14:["Complete a full mock interview","Sharpen your personal pitch","Leave with a job search action plan"],
    15:["Deliver a confident 60-second pitch","Write cold outreach that gets replies","Network on LinkedIn with purpose"],
    16:["Apply consistently and track every application","Prepare for and follow up after interviews","Keep your momentum after the programme"]};
  [3,4,5,6].forEach((w,i)=>OBJ[w]=tl[i].points);
  [9,10,11,12].forEach(w=>OBJ[w]=["Work on live tasks under supervision","Attend stand-ups and report progress clearly","Record your week accurately in your logbook"]);
  const EXTRA_RES={1:["Email templates pack","DOC"],2:["Trello board template","Template"],3:["Practice workbook","XLSX"],4:["Practice workbook","XLSX"],5:["Practice workbook","XLSX"],6:["Module assignment brief","PDF"],7:["Scenario brief & rubric","PDF"],13:["ATS CV template","DOC"],14:["Interview question bank","PDF"],15:["Cold outreach templates","DOC"]};
  ws.forEach((w,i)=>{if(i===0)return;w.objectives=OBJ[i];w.resources=[[`Week ${i+1} slides`,"PDF"],["Kickoff session recording","Video"],...(EXTRA_RES[i]?[EXTRA_RES[i]]:[])]});
  ws[0].items.forEach(it=>{if(it.title==="Join your cohort community")it.opt=true});
  ws[1].items.push(weekQuiz(1,ws[1]),{...T("Week project: rewrite a messy email","Rewrite the sample email from the Professional communication lesson so it's clear and professional. Share a link. Your facilitator grades it with the rubric.",true),proj:true});
  [3,4,5,6].forEach(w=>ws[w].items.splice(1,0,weekQuiz(w,ws[w])));
  [3,4,5,6].forEach(w=>ws[w].items.push({...T("Stretch challenge","A harder extra exercise for learners who want to go further. Share a link to your work.",true),opt:true}));
  ws[13].items.push({...T("CV swap with a pod member","Swap CVs with someone in your pod and give feedback using the checklist."),opt:true});
  return _wkCache[track]=ws;
}

const TOUR = [
  {t:"Welcome to JobNest Academy 👋", b:"Give us 60 seconds and we'll show you where everything lives. You can skip anytime."},
  {t:"Home: your daily starting point", b:"Home shows today's task, how many days are left this week and your next live session. Start here every day.", sel:"#nav-home"},

  {t:"You're all set!", b:"Start with Week 1: read and sign your Student Oath, then the rest of your journey opens up."}
];

/* ---------- state ---------- */
const KEY="jobnest-proto-v8";
let S = Object.assign(fresh(), load() || {});
function fresh(){return {attempts:{}, user:null, passwords:{}, tourSeen:{}, tour:null, done:{}, quiz:{}, links:{}, logbook:{}, oath:{}, week:0, item:null, view:"week", unlockAll:false,
  page:"learning", notifs:[], reviews:{}, hist:{}, adraft:{}, goals:{}, selfSkills:{}, portfolio:{}, saved:{}, oppStatus:{}, support:[], posts:[], interview:{}, sel:null, lastAct:null, notifSeeded:{}, subAt:{}, checkin:{}, celebrated:{}, celebrate:null, reminders:{}, lowData:false, moreOpen:false, supMsgs:{}, booking:{}, bk:null, bkCancel:false, confidence:{}, prep:{}, photos:{}, cv:{}, li:{}, outreach:{}, apps:{}, pitch:{}, res:null, role:"student", rtab:{}, avail:{}, evals:{}, pub:"apply", applicant:null, prefill:null}}
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function set(p,keepScroll){Object.assign(S,p);save();render(keepScroll)}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const me=()=>STUDENTS[S.user];
const uk=k=>S.user+"|"+k;
const today=()=>new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
function greeting(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}

/* ---------- render ---------- */
function render(keepScroll){
  const rs=$("#p-role"); if(rs) rs.value=S.adminMode?"admin":(S.role||"student");
  if(!S.adminMode&&S.role&&S.role!=="student"&&S.role!=="admin"){$("#topbar").hidden=true;$("#app").innerHTML=rolePage();$("#tour-root").innerHTML="";if(!keepScroll)window.scrollTo({top:0});return}
  if(S.adminMode){$("#topbar").hidden=true;$("#app").innerHTML=adminPage();$("#tour-root").innerHTML="";if(!keepScroll)window.scrollTo({top:0});return}
  $("#topbar").hidden = !S.user;
  if(S.user) checkMilestones();
  $("#app").innerHTML = S.user && S.page==="setpw" ? setPwPage() : S.user ? appNav() + (S.page==="learning"||!PAGES[S.page] ? campus() : pageOpen(S.page) ? PAGES[S.page]() : lockedPage(S.page)) + `<button class="fab" data-go="help" aria-label="Need help? Go to Help & Support"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg><span>Need help?</span></button>` : login();
  if(S.user){const u=me();$("#who").innerHTML=(S.page==="setpw"?"":bellHTML())+`<button class="chip" id="tour-profile" type="button" ${S.page==="setpw"?"disabled":""}>${avatar("av")}<span class="nm">${esc(u.first)}</span><span class="mono">${S.user}</span></button><button class="link" id="signout" type="button" style="font-size:.85rem">Sign out</button>`}
  bind(); renderTour();
  if(!keepScroll) window.scrollTo({top:0});
}

/* ---------- campus ---------- */
const itemId=(wi,ii)=>`w${wi}i${ii}`;
const isDone=(wi,ii)=>!!S.done[uk(itemId(wi,ii))];
/* Only mandatory items count towards finishing a week */
function weekProgress(wk,wi){let d=0,n=0;wk.items.forEach((it,ii)=>{if(it.opt)return;n++;if(isDone(wi,ii))d++});return {d,n,pct:n?Math.round(d/n*100):100}}
const weekItemsDone=(wk,wi)=>{const p=weekProgress(wk,wi);return p.d===p.n};
/* Stages 2–4 (index 1–3): week passes only with an average of 70%+ (quiz + week project; project weeks: project only) */
let PASS_MARK=70;
function weekGate(wi){if(!S.user)return null;const ws=buildWeeks(me().track),wk=ws[wi];if(!wk||wk.stage<1||wk.stage>3)return null;
  const qi=wk.items.findIndex(x=>x.type==="quiz"),pi=wk.items.findIndex(x=>x.proj);
  const q=qi>=0?S.quiz[uk(itemId(wi,qi))]??null:null, r=pi>=0?S.reviews[uk(itemId(wi,pi))]:null, pr=r&&r.status==="Graded"?r.score:null;
  const g={qi,pi,q,p:pr,hasQuiz:qi>=0,attempt:S.attempts[uk("w"+wi)]||1};
  if(r&&r.status==="Revision Required")return {...g,state:"revise"};
  if(!weekItemsDone(wk,wi))return {...g,state:"open"};
  if(pr==null)return {...g,state:"grading"};
  g.avg=Math.round(qi>=0?(q+pr)/2:pr);g.state=g.avg>=PASS_MARK?"pass":"fail";return g}
const weekDone=(wk,wi)=>{if(!weekItemsDone(wk,wi))return false;const g=weekGate(wi);return !g||g.state==="pass"};
function gateCard(wi){const g=weekGate(wi);if(!g)return "";
  const tile=(l,v,n)=>`<div class="gt"><span class="eyebrow">${l}</span><b class="mono">${v}</b><span class="note">${n}</span></div>`;
  const pSt=S.reviews[uk(itemId(wi,g.pi))]?.status, pLabel=g.p!=null?g.p+"%":pSt==="Revision Required"?"Revise":pSt?"Grading":isDone(wi,g.pi)?"Grading":"—";
  const msg={open:`Complete ${g.hasQuiz?"the assessment and the week project":"the week project"}. You need ${g.hasQuiz?"an average of ":""}<b>${PASS_MARK}% or more</b> to move on. Below ${PASS_MARK}%, you repeat this week.`,
    grading:`Your week project is with your facilitator. The next week unlocks once it's graded and your ${g.hasQuiz?"average":"grade"} is ${PASS_MARK}% or more.`,
    revise:`Your facilitator asked for changes to your week project. Make them and resubmit.`,
    pass:`Passed. Well done!`,
    fail:`You need ${PASS_MARK}% to move on. Repeat this week to try again: the lessons, assessment and project reset.`}[g.state];
  return `<div class="gate-card ${g.state}"><div class="gc-h"><div><span class="eyebrow">Week result${g.attempt>1?` · attempt ${g.attempt}`:""}</span><b>${g.state==="pass"?"Week passed":g.state==="fail"?"Week not passed":g.state==="grading"?"Waiting for your grade":g.state==="revise"?"Revision requested":"Pass mark: "+PASS_MARK+"%"}</b></div>
    <div class="gc-tiles">${g.hasQuiz?tile("Assessment",g.q!=null?g.q+"%":"—","quiz"):""}${tile("Week project",pLabel,"graded by facilitator")}${tile(g.hasQuiz?"Average":"Grade",g.avg!=null?g.avg+"%":"—","need "+PASS_MARK+"%")}</div></div>
    <p>${msg}</p>${g.state==="fail"?`<div><button class="btn" data-repeat="${wi}">Repeat Week ${wi+1}</button></div>`:""}</div>`}
function weekPill(wk,wi,un){if(!un)return `<span class="pill">Locked</span>`;const g=weekGate(wi),p=weekProgress(wk,wi);
  if(g&&g.state!=="open")return `<span class="pill ${g.state==="pass"?"ok":g.state==="fail"?"bad":"info"}">${g.state==="pass"?"Passed · "+g.avg+"%":g.state==="fail"?"Not passed · "+g.avg+"%":g.state==="revise"?"Revision requested":"Awaiting grade"}</span>`;
  return `<span class="pill ${p.d===p.n?"ok":"now"}">${p.d===p.n?"Complete":p.d+" of "+p.n+" required done"}</span>`}
function unlocked(weeks,wi){if(S.unlockAll||wi===0)return true;return weekDone(weeks[wi-1],wi-1)}
function oathSigned(){const w=buildWeeks(me().track);return isDone(0,w[0].items.findIndex(x=>x.type==="oath"))}

/* ---------- deadlines & scores ---------- */
const graceDue=i=>{const d=new Date(weekStart(i).getTime()+6*DAY);d.setHours(23,59,0,0);return d};
function capFor(wi,id){const t=S.subAt[id];if(!t)return null;return t<=weekDue(wi)?1:t<=graceDue(wi)?.8:.5}
function itemScore(wi,ii){const ws=buildWeeks(me().track),it=ws[wi].items[ii],id=uk(itemId(wi,ii));
  if(it.type==="quiz")return S.quiz[id]??null;
  if(it.type==="logweek")return null; // internship is not scored
  const r=S.reviews[id];return r&&r.status==="Graded"?r.score:null}
function weekScore(wi){const ws=buildWeeks(me().track),sc=ws[wi].items.map((_,ii)=>itemScore(wi,ii)).filter(x=>x!=null);return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null}
function avgScore(){const ws=buildWeeks(me().track),sc=ws.map((_,i)=>weekScore(i)).filter(x=>x!=null);return sc.length?Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null}
function deadlineLine(wi){return `<div class="deadlines"><span><b>Full marks</b> until ${fmtD(weekDue(wi))}, 17:00</span><span><b>80% max</b> until ${fmtD(graceDue(wi))}, 23:59</span><span><b>50% max</b> after that</span></div>`}
function joinState(s){const now=Date.now(),t=s.at.getTime();return now<t-10*60000?{k:"soon",l:"Join opens 10 min before",dis:true}:now<=t+90*60000?{k:"live",l:"Join live session",dis:false}:{k:"past",l:"Watch recording",dis:false}}
function weekSession(wi){return sessionsAll().filter(s=>s.week===wi&&s.type!=="Deadline")[0]}
function sessionCard(s,compact){if(!s)return "";const j=joinState(s);
  return `<div class="sess ${j.k}"><span class="date"><b>${s.at.getDate()}</b><small>${s.at.toLocaleDateString("en-GB",{month:"short"})}</small></span><div><span class="eyebrow">${j.k==="live"?"Live now":s.type}</span><b>${esc(s.title)}</b><span class="note">${fmtD(s.at)} · ${fmtT(s.at)} WAT${compact?"":" · Recording posted within 24 hours"}</span></div><button class="btn sm ${j.k==="live"?"gold":"ghost"}" data-join="${j.k}" ${j.dis?"disabled":""}>${j.l}</button></div>`}

/* ---------- milestones: stage-complete screen + unlock notices ---------- */
function checkMilestones(){
  if(!S.user)return; const ws=buildWeeks(me().track);
  STAGES.forEach((st,si)=>{const k=uk("stage"+si);if(S.celebrated[k])return;
    const wks=ws.map((w,i)=>w.stage===si?i:-1).filter(i=>i>=0);
    if(wks.every(i=>weekDone(ws[i],i))){S.celebrated[k]=1;S.celebrate={si,next:wks.at(-1)+1}}});
  if(!S.celebrated[uk("career")]&&unlocked(ws,WK.cv)&&!S.unlockAll&&weekDone(ws[WK.cv-1],WK.cv-1)){S.celebrated[uk("career")]=1;notify("New: My Career is now open","Set your career goals, check your readiness and prepare for interviews.",{page:"career"})}
  if(!S.celebrated[uk("opps")]&&!S.unlockAll&&weekDone(ws[WK.dc],WK.dc)){S.celebrated[uk("opps")]=1;notify("New: Opportunities are now open","Browse jobs and internships and track your applications.",{page:"opps"})}
}
function celebrateHTML(){const c=S.celebrate;if(!c)return "";const ws=buildWeeks(me().track),st=STAGES[c.si],nx=STAGES[c.si+1],last=c.si===STAGES.length-1;
  return `<div class="scrim"></div><div class="tour celebrate-modal" role="dialog" aria-modal="true" aria-labelledby="cel-t">
    <div class="cel-badge"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg></div>
    <p class="eyebrow" style="text-align:center">Stage ${c.si+1} of ${STAGES.length} complete</p>
    <h2 id="cel-t" style="text-align:center">${last?"You did it, "+esc(me().first)+"!":"Well done, "+esc(me().first)+"!"}</h2>
    <p style="text-align:center">${last?"You've completed every stage of the JobNest Career Accelerator. We're so proud of you. Keep going: your next role is out there.":`You've finished <b>${st.title}</b>. <b>Stage ${c.si+2}: ${nx.title}</b> is now unlocked.`}</p>
    <div class="ft" style="justify-content:center"><button class="btn gold" id="cel-go">${last?"See my achievements":`Start Week ${c.next+1} →`}</button></div></div>`}

/* ---------- campus page ---------- */
function campus(){
  const u=me(), weeks=buildWeeks(u.track);
  let total=0,done=0;weeks.forEach((wk,wi)=>{const p=weekProgress(wk,wi);total+=p.n;done+=p.d});
  const pct=Math.round(done/total*100), current=weeks.findIndex((wk,wi)=>!weekDone(wk,wi)), avg=avgScore();
  const viewStage=weeks[S.week]?.stage??0;
  const groups=STAGES.map((st,si)=>{
    const idx=weeks.map((w,i)=>w.stage===si?i:-1).filter(i=>i>=0);
    const dn=idx.filter(i=>weekDone(weeks[i],i)).length, open=unlocked(weeks,idx[0]), all=dn===idx.length;
    const wks=idx.map(i=>{const wk=weeks[i],p=weekProgress(wk,i),un=unlocked(weeks,i),d=weekDone(wk,i),gg=weekGate(i);
      return `<button class="stage-btn ${d?"done":(i===current?"now":"")} ${un?"":"locked"}" data-week="${i}" aria-current="${S.view==="week"&&i===S.week}">
      <span class="n">${d?"✓":i+1}</span><span><small>Week ${i+1}</small><b>${esc(wk.title)}</b></span><span class="lk">${!un?"🔒":d?"":gg&&gg.state==="fail"?"Repeat":gg&&gg.state==="grading"?"Grading":p.d+"/"+p.n}</span></button>`}).join("");
    return `<details class="sg ${all?"done":open?"":"locked"}" ${si===viewStage?"open":""}><summary><span class="sg-n">${all?"✓":si+1}</span><span class="sg-t"><small>Stage ${si+1}</small><b>${st.title}</b></span><span class="sg-s">${all?"Done":open?`${dn}/${idx.length}`:"🔒"}</span></summary><div class="sg-w">${wks}</div></details>`}).join("");
  const main = S.view==="lbguide" ? logbookGuide(weeks) : S.view==="res"&&S.res ? resourceView(weeks) : S.view==="brief" ? briefView(weeks) : (S.item!==null ? itemView(weeks,S.week,S.item) : weekView(weeks,S.week));
  return `<div class="wrap lhead">
    <div><p class="eyebrow">${TRACKS[u.track].name} · ${COHORT}</p><h1>My Learning</h1></div>
    <div class="lh-prog" id="tour-progress"><div class="lh-bar"><i style="width:${pct}%"></i></div><span><b class="mono">${pct}%</b> complete · Week ${current<0?TOTAL_WEEKS:current+1} of ${TOTAL_WEEKS}${avg!=null?` · avg <b class="mono">${avg}%</b>`:""}</span></div>
  </div>
  <section class="wrap campus">
    <aside>${weekSelect(weeks)}<nav class="rail" id="tour-rail" aria-label="Programme stages and weeks">${groups}</nav></aside>
    <div>${main}</div>
  </section>`;
}

};
const KIND={lesson:"Video lesson",quiz:"Assessment",task:"Activity",logweek:"Internship logbook",oath:"Student Oath",guide:"Getting started"};
function itemSub(it,wi,ii){const dn=isDone(wi,ii),e=it.type==="logweek"?S.logbook[uk("lb"+it.wk)]:null;
  return it.type==="lesson"?`${KIND.lesson} · ${it.mins} min`:it.type==="quiz"?`${KIND.quiz} · ${it.qs.length} questions · counts toward your week result`
    :it.type==="logweek"?`${KIND.logweek} · ${e?.signed?"signed off by supervisor":e?.submitted?"awaiting supervisor sign-off":e?.draft?"draft saved":"fill at the end of the week"}`
    :it.type==="oath"?(dn?"Signed":"Required to unlock Week 2 · about 3 min"):it.type==="guide"?"Platform guide · about 4 min":KIND.task+(it.link?" · submit a link":"")}

function weekView(weeks,wi){
  if(weeks[wi].stage===4) return internWeekView(weeks,wi);
  if(wi===WK.cv) return cvWeekView(weeks,wi);
  if(WK.job.includes(wi)) return jobWeekView(weeks,wi);
  if(weeks[wi].stage===3) return projectWeekView(weeks,wi);
  if(wi===WK.dc) return discoveryWeekView(weeks,wi);
  const wk=weeks[wi], st=STAGES[wk.stage], p=weekProgress(wk,wi), u=me(), un=unlocked(weeks,wi);
  const opt=(it)=>it.opt?`<span class="req opt">Optional</span>`:"";
  const items=wk.items.map((it,ii)=>{
    const dn=isDone(wi,ii), s=itemScore(wi,ii);
    if(!un) return `<div class="item locked"><span class="ic">${ICON.lock}</span><div><b>${esc(it.title)}</b><small>${itemSub(it,wi,ii)}</small></div>${opt(it)}</div>`;
    const pill = dn?`<span class="pill ok">${s!=null?s+"%":"Done"}</span>`:`<span class="pill">Start</span>`;
    return `<button class="item ${dn?"done":""}" data-item="${ii}"><span class="ic">${dn?ICON.done:ICON[it.type]}</span><div><b>${esc(it.title)}</b><small>${itemSub(it,wi,ii)}</small></div><span class="item-r">${opt(it)}${pill}</span></button>`}).join("");
  const next = un && weekDone(wk,wi) && wi<weeks.length-1 ? `<div class="celebrate"><div><b>Week ${wi+1} complete.</b> <span class="note">Week ${wi+2}: ${esc(weeks[wi+1].title)} is now unlocked.</span></div><button class="btn sm" data-week="${wi+1}">Start Week ${wi+2} →</button></div>`:"";
  const head=(extra)=>`<div class="stage-head wk-head" id="tour-head">
    <div class="row"><div><p class="eyebrow">Week ${wi+1} of ${TOTAL_WEEKS} · Stage ${wk.stage+1}: ${st.title}</p><h2 style="margin-top:.45rem">${esc(wk.title)}</h2></div>${weekPill(wk,wi,un)}</div>${extra}</div>`;

  // Orientation keeps its welcome page
  if(st.welcome) return head(`<div class="welcome">
      <p class="big">Congratulations, ${esc(u.first)}. You took a bold step.</p>
      <p>Choosing to invest in yourself and your future takes courage, and you've already done the hardest part: you started. We're proud to have you in ${COHORT}.</p>
      <p>Over the next 17 weeks you'll learn skills employers are hiring for, solve a real business problem in your own client project, and gain real work experience in your internship. Some weeks will stretch you. That is where the growth happens, and we'll be beside you every week.</p>
      <p>Show up, ask questions and keep going. We can't wait to see you build a career you are proud of.</p>
      <div><span class="sig">The JobNest Academy Team</span></div></div>
    <div class="bar" aria-hidden="true"><i style="width:${p.pct}%"></i></div>
    ${oathSigned()?"":`<div class="gate">${ICON.lock}<span>Complete the ${p.n} required tasks below. <b>Week 2 stays locked until you read and sign your Student Oath.</b></span></div>`}`)
    +`<div class="items" id="tour-items">${items}</div>${next}`;

  const tab=S.wtab||"tasks", sess=un?weekSession(wi):null;
  const stWeeks=weeks.map((w,i)=>w.stage===wk.stage?i+1:null).filter(Boolean);
  const tabs=[["tasks","Tasks",`${p.d}/${p.n}`],["about","About this week",""],["res","Resources",String(wk.resources.length)]];
  const lockMsg=!un?`<div class="gate">${ICON.lock}<span><b>Preview.</b> ${wi===1&&!oathSigned()?"Opens when you sign your Student Oath in Week 1.":`Opens when you pass Week ${wi}: ${esc(weeks[wi-1].title)}.`}</span></div>`:"";
  const meta=`<div class="wk-meta-row"><span>Due ${fmtD(weekDue(wi))}, 17:00</span>${sess?`<span>Live: ${fmtD(sess.at)}, ${fmtT(sess.at)}</span>`:""}</div>
    ${un?`<div class="bar" aria-hidden="true"><i style="width:${p.pct}%"></i></div>`:""}
    <div class="wtabs" role="tablist">${tabs.map(([k,l,c])=>`<button role="tab" data-wtab="${k}" aria-selected="${tab===k}">${l}${c?` <span class="mono">${c}</span>`:""}</button>`).join("")}</div>`;
  let body="";
  if(tab==="tasks"){const ck=S.checkin[uk("w"+wi)];
    body=`${lockMsg}${un?gateCard(wi):""}
    <div class="items" id="tour-items">${items}</div>${next}
    ${un&&wi%2===1?`<form class="card checkin" id="checkin" data-wk="${wi}" novalidate>
      <div class="ch"><h3>Weekly check-in</h3>${ck?`<span class="pill ok">Sent ${esc(ck.on)}</span>`:""}</div>
      <p class="note">How confident do you feel about this week? Your facilitator reaches out if you need support.</p>
      <div class="rate conf" role="radiogroup" aria-label="Confidence this week">${[["1","Lost"],["2","Unsure"],["3","Okay"],["4","Confident"],["5","Very confident"]].map(([n,t])=>`<label><input type="radio" name="conf" value="${n}" ${ck?.v===n?"checked":""}><span>${n} · ${t}</span></label>`).join("")}</div>
      <div class="field"><label for="ck-note">Anything you're stuck on? (optional)</label><input id="ck-note" value="${esc(ck?.note||"")}" placeholder="e.g. I don't understand pivot tables yet"></div>
      <div><button class="btn sm" type="submit">${ck?"Update check-in":"Send check-in"}</button></div></form>`:""}`}
  if(tab==="about") body=`<div class="card about-card">
      <h3>By the end of this week you can</h3><ul class="obj">${(wk.objectives||[]).map(o=>`<li>${esc(o)}</li>`).join("")}</ul>
      <h3>Deadlines</h3>${deadlineLine(wi)}
      <h3>How this week is passed</h3><p class="note">Your assessment score and week project grade are averaged. You need ${PASS_MARK}% or more to move on; below that, you repeat the week.</p>
      ${sess?`<h3>Live session</h3>${sessionCard(sess)}`:""}
      <h3>About Stage ${wk.stage+1}: ${st.title}</h3><p>${esc(st.objective)}</p>
      <dl class="kv"><div><dt>Weeks</dt><dd>${stWeeks.length>1?`Weeks ${stWeeks[0]}–${stWeeks.at(-1)}`:`Week ${stWeeks[0]}`}</dd></div><div><dt>Facilitators</dt><dd>${esc(st.facilitators)}</dd></div></dl></div>`;
  if(tab==="res") body=`<div class="card"><ul class="res">${wk.resources.map((r,ri)=>`<li><button class="resbtn" data-res="${wi},${ri}" ${un?"":"disabled"}>${ICON.file}<span>${esc(r[0])}</span><span class="tag">${r[1]}</span></button></li>`).join("")}</ul>${un?"":`<p class="note" style="margin-top:.6rem">Resources open when this week unlocks.</p>`}</div>`;
  return head(meta)+`<div class="wk-body">${body}</div>`;
}

/* Internship weeks: just the logbook, the guide and the week's admin tasks */
function internWeekView(weeks,wi){
  const wk=weeks[wi], u=me(), pl=PLACEMENT[u.track], un=unlocked(weeks,wi), p=weekProgress(wk,wi);
  const iw=wi-WK.int0+1, li=wk.items.findIndex(it=>it.type==="logweek"), e=S.logbook[uk("lb"+iw)]||{};
  const status=e.signed?["ok","Signed off by your supervisor"]:e.submitted?["info","Submitted · awaiting supervisor sign-off"]:e.draft?["now","Draft saved · not submitted yet"]:["","Not started"];
  const others=wk.items.map((it,ii)=>({it,ii})).filter(x=>x.it.type!=="logweek");
  const lock = !un ? `<div class="gate">${ICON.lock}<span><b>Preview.</b> This week opens when you finish Week ${wi}: ${esc(weeks[wi-1].title)}.</span></div>`:"";
  const trackW=[1,2,3,4].map(n=>{const x=S.logbook[uk("lb"+n)]||{};return `<li class="${x.signed?"done":x.submitted?"sub":""} ${n===iw?"cur":""}"><span class="mono">W${n}</span><small>${x.signed?"Signed":x.submitted?"Sent":n===iw?"This week":"—"}</small></li>`}).join("");
  return `<div class="stage-head intern" id="tour-head">
    <div class="row"><div><p class="eyebrow">Week ${wi+1} of ${TOTAL_WEEKS} · Stage 5: Internship</p><h2 style="margin-top:.45rem">Internship week ${iw} of ${INTERN_WEEKS}</h2></div>
      <span class="pill ${!un?"":p.d===p.n?"ok":"now"}">${!un?"Locked":p.d===p.n?"Complete":p.d+" of "+p.n+" required done"}</span></div>
    ${lock}
    <dl class="placement"><div><dt>Host organisation</dt><dd>${esc(pl.org)}</dd></div><div><dt>Supervisor</dt><dd>${esc(pl.sup)}</dd></div><div><dt>Your role</dt><dd>${esc(pl.role)}</dd></div></dl>
    <p style="max-width:62ch">This week you're working at your placement. Your only job on the portal is to fill your <b>logbook entry</b> at the end of the week so your supervisor can sign it off.</p>
    <ol class="lbtrack" aria-label="Logbook progress">${trackW}</ol>
  </div>
  <div class="intern-grid">
    <button class="lbmain ${status[0]}" ${un&&li>=0?`data-item="${li}"`:"disabled"}>
      <span class="ic">${ICON.logweek}</span>

function seqNav(weeks,wi,ii){
  const st=weeks[wi].stage, flat=[];
  weeks.forEach((w,i)=>{if(w.stage===st&&unlocked(weeks,i))w.items.forEach((_,k)=>flat.push([i,k]))});
  const at=flat.findIndex(([a,b])=>a===wi&&b===ii), prev=at>0?flat[at-1]:null, nxt=at>=0&&at<flat.length-1?flat[at+1]:null;
  const lbl=([w,i])=>`${w!==wi?`Week ${w+1}: `:""}${esc(weeks[w].items[i].title)}`;
  let right;
  if(nxt) right=`<button class="seqbtn nx" data-nav="${nxt}"><small>Next →</small><span>${lbl(nxt)}</span></button>`;
  else{const laterInStage=weeks.findIndex((w,i)=>i>wi&&w.stage===st), nsw=weeks.findIndex(w=>w.stage===st+1);
    if(laterInStage>=0) right=`<button class="seqbtn nx dis" id="back2"><small>Next week locked</small><span>Pass Week ${wi+1} to open Week ${laterInStage+1}</span></button>`;
    else if(nsw>=0&&unlocked(weeks,nsw)) right=`<button class="seqbtn nx go" data-week="${nsw}"><small>Stage ${st+1} complete</small><span>Move to Stage ${st+2}: ${esc(STAGES[st+1].title)} →</span></button>`;
    else if(nsw>=0) right=`<button class="seqbtn nx dis" id="back2"><small>Move to Stage ${st+2}</small><span>${st>=1&&st<=3?`Pass every week in Stage ${st+1} with ${PASS_MARK}%+ to unlock`:`Finish every task in Stage ${st+1} to unlock`}</span></button>`;
    else right=`<button class="seqbtn nx" id="back2"><small>Done</small><span>Back to Week ${wi+1}</span></button>`}
  return `<div class="seq">${prev?`<button class="seqbtn" data-nav="${prev}"><small>← Previous</small><span>${lbl(prev)}</span></button>`:"<span></span>"}${right}</div>`;
}

      ${score!=null?"":`<div style="margin-top:1rem"><button class="btn" type="submit">Submit answers</button></div>`}</form>${nav}</div>`}
  const cap=capFor(wi,id);
  return `<div class="view">${head}<p style="max-width:64ch">${esc(it.detail)}</p>
    ${it.link?deadlineLine(wi):""}
    ${it.link?`<div class="field"><label for="link">Link to your work</label><input id="link" placeholder="https://" value="${esc(S.links[id]||"")}"></div>`:""}
    ${dn&&cap!=null&&cap<1?`<p class="note">Submitted after the first deadline: maximum ${cap*100}% for this assignment.</p>`:""}
    <div class="actions"><button class="btn ${dn?"ghost":""}" id="complete">${dn?"Submitted ✓ · Undo":"Mark as submitted"}</button>${it.link?`<button class="link" data-go="assignments" data-sel="${wi},${ii}">See feedback & history</button>`:""}</div>${nav}</div>`;

function handlePhoto(file){if(!file||!/^image\//.test(file.type)){toast("Choose an image file (JPG or PNG)");return}
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),sz=240;c.width=c.height=sz;const g=c.getContext("2d"),m=Math.min(img.width,img.height);g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,sz,sz);S.photos[S.user]=c.toDataURL("image/jpeg",.85);save();toast("Photo updated");render(true)};img.onerror=()=>toast("That image couldn't be read. Try another file.");img.src=fr.result};fr.readAsDataURL(file)}

const ACT={

  reply(m,txt){asUser(m,()=>{(S.supMsgs[uk("proj")]=S.supMsgs[uk("proj")]||[]).push({t:txt,at:Date.now()});notify("Your project supervisor replied","Open your project page to read it.",{page:"learning",view:"week",week:WK.proj[0],item:null})})},

let COHORT_START = new Date(2026,10,2,9,0); // Mon 2 Nov 2026 (placeholder)
const DAY=86400000;
const weekStart=i=>new Date(COHORT_START.getTime()+i*7*DAY);
const weekDue=i=>{const d=new Date(weekStart(i).getTime()+4*DAY);d.setHours(17,0,0,0);return d};
const fmtD=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtDY=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fmtT=d=>d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
function dueLabel(d){const days=Math.ceil((d-Date.now())/DAY);return days<0?{t:"Overdue",c:"bad"}:days===0?{t:"Due today",c:"warn"}:days<=3?{t:`Due in ${days} day${days>1?"s":""}`,c:"warn"}:{t:"Due "+fmtD(d),c:""}}

  [3,5].forEach(w=>S_.push({at:at(w,2,16),type:"Mentoring",title:"Group mentoring & office hours",week:w}));
  S_.push({at:at(7,0,11),type:"Workshop",title:"Client project briefing",week:7});
  S_.push({at:at(9,0,14),type:"Milestone",title:"Internship induction",week:9});
  S_.push({at:at(13,2,15),type:"Workshop",title:"CV & LinkedIn clinic",week:13});

function encouragement(ws,cur){
  const p=weekProgress(ws[cur],cur), left=p.n-p.d;
  if(!oathSigned())return "Start here: read and sign your Student Oath to unlock Week 2.";
  const g=weekGate(cur);
  if(g&&g.state==="fail")return `Week ${cur+1} average: ${g.avg}%. You need ${PASS_MARK}% to move on, so repeat this week. You've got this.`;
  if(g&&g.state==="grading")return `All Week ${cur+1} tasks done. Your project is being graded.`;
  if(g&&g.state==="revise")return `Your facilitator asked for changes to your Week ${cur+1} project.`;
  if(left===0)return `Week ${cur+1} is done. Week ${cur+2} is ready when you are.`;
  if(left===1)return `You're 1 task away from finishing Week ${cur+1}. Finish strong!`;
  if(p.d===0)return `New week, fresh start. Begin with “${ws[cur].items.find((it,ii)=>!it.opt&&!isDone(cur,ii)).title}”.`;

  if(!S.user)return;
  // close bell when clicking elsewhere
  if(S.bellOpen&&!e.target.closest(".bellwrap")){S.bellOpen=false;save();render(true)}
  if(!t)return;
  if(S.moreOpen&&!e.target.closest(".appnav")){S.moreOpen=false;save();render(true)}
  if(t.id==="more"){S.moreOpen=!S.moreOpen;S.bellOpen=false;save();render(true);return}
  if(t.dataset.locked){toast(`This opens in Week ${t.dataset.locked}`);return}
  if(t.id==="ap-submit"){const l=$("#ap-link").value.trim();if(!/^https?:\/\/\S+\.\S+/.test(l)){toast("Paste a link starting with https://");return}const ai=+t.dataset.ai,id=uk(itemId(WK.dc,ai));S.links[id]=l;S.done[id]=true;S.subAt[id]=Date.now();addHist(id,"Job Search Action Plan","Submitted");S.lastAct={t:"Submitted Job Search Action Plan",at:Date.now()};save();toast("Action plan submitted");render(true);return}
  if(t.dataset.coach){S.bk={coach:t.dataset.coach};save();render(true);return}
  if(t.dataset.day){S.bk={...S.bk,day:+t.dataset.day,time:null};save();render(true);return}
  if(t.dataset.slot){S.bk={...S.bk,time:t.dataset.slot};save();render(true);return}
  if(["bk-confirm","bk-resched","bk-cancel","bk-cancel-yes","bk-cancel-no","bk-done"].includes(t.id)){
    const ws=buildWeeks(me().track),bi=ws[WK.dc].items.findIndex(x=>x.title==="Book your 1-on-1 session"),mi=ws[WK.dc].items.findIndex(x=>x.title==="Mock interview simulation");
    if(t.id==="bk-confirm"){const b=S.bk,[h,m]=b.time.split(":").map(Number),at=new Date(weekStart(WK.dc).getTime()+b.day*DAY);at.setHours(h,m,0,0);
      S.booking[uk("dc")]={coach:b.coach,at:at.toISOString(),note:($("#bk-note")?.value||"").trim()};S.bk=null;S.done[uk(itemId(WK.dc,bi))]=true;S.lastAct={t:"Booked Discovery Call 2",at:Date.now()};
      notify("Discovery Call booked",`${fmtD(at)} at ${b.time} WAT with ${COACHES.find(c=>c.id===b.coach).n}`,{page:"learning",view:"week",week:WK.dc,item:null});toast("Booked. See you on "+fmtD(at))}
    if(t.id==="bk-resched"){S.bk={coach:dcBooking().coach};delete S.booking[uk("dc")];S.done[uk(itemId(WK.dc,bi))]=false;toast("Pick a new time")}
    if(t.id==="bk-cancel")S.bkCancel=true;
    if(t.id==="bk-cancel-no")S.bkCancel=false;
    if(t.id==="bk-cancel-yes"){delete S.booking[uk("dc")];S.bkCancel=false;S.bk=null;S.done[uk(itemId(WK.dc,bi))]=false;toast("Booking cancelled")}
    if(t.id==="bk-done"){S.done[uk(itemId(WK.dc,mi))]=true;S.confidence[S.user]={score:7,note:"Clear, confident introduction. Use more numbers when you describe your project results.",next:["Apply to 5 targeted roles a week","Practise two STAR stories about your internship","Message 3 people in your target companies on LinkedIn"]};notify("Your Discovery Call results are in","Interview Confidence Score: 7/10",{page:"learning",view:"week",week:WK.dc,item:null});toast("Call marked as completed")}
    save();render(true);return}
  if(t.dataset.nav){const [wi,ii]=t.dataset.nav.split(",").map(Number);set({week:wi,item:ii});return}
  if(t.dataset.join){toast(t.dataset.join==="past"?"Recordings are posted under the week within 24 hours":"Opens the session link your facilitator adds");return}
  if(t.dataset.res){const [wi,ri]=t.dataset.res.split(",").map(Number);if(isNaN(ri)){toast("Available once your facilitator uploads it");return}set({page:"learning",view:"res",res:{wi,ri},item:null});return}
  if(t.dataset.brief){set({page:"learning",view:"brief",item:null});return}
  if(t.dataset.resPlay){toast("The recording plays here once it's uploaded");return}
  if(t.dataset.resTpl){const w=WK.job[0],ws=buildWeeks(me().track),ri=ws[w].resources.findIndex(r=>/outreach/i.test(r[0]));set({page:"learning",view:"res",res:{wi:w,ri},item:null});return}
  if(t.dataset.staff){staffAct(t);return}
  if(t.dataset.repeat){const wi=+t.dataset.repeat,ws=buildWeeks(me().track);ws[wi].items.forEach((_,ii)=>{const id=uk(itemId(wi,ii));["done","quiz","reviews","links","subAt","adraft"].forEach(k=>delete S[k][id]);addHist(id,ws[wi].items[ii].title,"Week restarted")});
    const k=uk("w"+wi);S.attempts[k]=(S.attempts[k]||1)+1;notify(`Week ${wi+1} restarted`,`Attempt ${S.attempts[k]}. Work through the lessons again, then retake the assessment and resubmit your project.`,{page:"learning",view:"week",week:wi,item:null});
    set({page:"learning",view:"week",week:wi,item:null});toast(`Week ${wi+1} restarted. You've got this!`);return}
  if(t.id==="bell"){S.bellOpen=!S.bellOpen;S.moreOpen=false;save();render(true);return}
  if(t.id==="notif-read"){S.notifs.forEach(n=>{if(!n.u||n.u===S.user)n.read=true});save();render(true);return}
  if(t.dataset.notif){const n=S.notifs[+t.dataset.notif];n.read=true;S.bellOpen=false;if(n.go)Object.assign(S,n.go);save();render();return}
  if(t.dataset.open){const [wi,ii]=t.dataset.open.split(",").map(Number);set({page:"learning",view:"week",week:wi,item:ii,sel:null});return}
  if(t.dataset.go){const p={page:t.dataset.go,sel:t.dataset.sel||null,moreOpen:false};if(t.dataset.go==="learning"){p.view="week";p.item=null}set(p);return}
  if(t.dataset.sel&&!t.dataset.go){set({sel:t.dataset.sel});return}
  if(t.dataset.asf){set({asFilter:t.dataset.asf},true);return}
  if(t.dataset.of){set({oppFilter:t.dataset.of},true);return}
  if(t.dataset.save){const k=t.dataset.save;S.saved[k]=!S.saved[k];toast(S.saved[k]?"Saved to your opportunities":"Removed from saved");save();render(true);return}
  if(t.dataset.apply){toast("Sample listing: real application links will come from Jobnest Recruit");return}
  if(t.dataset.report){toast("Thanks. A moderator will review this post");return}
  if(t.dataset.simReq){const r=S.support[+t.dataset.simReq];if(r.status==="Open"){r.status="In Progress";notify("Support request in progress",r.subject,{page:"help"})}else{r.status="Resolved";r.reply="Thanks for reaching out. This has been fixed on our side. Reply here if you still see the problem.";notify("Support request resolved",r.subject,{page:"help"})}save();render(true);return}
  const sel=S.sel&&S.sel.split(",").map(Number);
  if(sel&&["rv-start","rv-grade","rv-revise"].includes(t.id)){
    const id=uk(itemId(sel[0],sel[1])),it=buildWeeks(me().track)[sel[0]].items[sel[1]];S.reviews[id]=S.reviews[id]||{};
    if(t.id==="rv-start"){S.reviews[id].status="Under Review";addHist(id,it.title,"Facilitator started review")}
    if(t.id==="rv-grade"){const cp=capFor(sel[0],id)||1;Object.assign(S.reviews[id],{status:"Graded",score:Math.round(84*cp),raw:84,cap:cp,on:today(),feedback:"Strong, well-organised work that meets the brief. To push higher, explain your reasoning more clearly in your note and double-check small details before submitting."});addHist(id,it.title,`Graded ${S.reviews[id].score}/100`);notify("Assignment graded",`${it.title}: ${S.reviews[id].score}/100`,{page:"assignments",sel:S.sel})}
    if(t.id==="rv-revise"){Object.assign(S.reviews[id],{status:"Revision Required",on:today(),feedback:"Good start, but one required part of the brief is missing. Add it, check the rubric, and resubmit by Friday."});addHist(id,it.title,"Revision requested");notify("Revision requested",it.title,{page:"assignments",sel:S.sel})}
    save();render(true);return}
});
document.addEventListener("change",e=>{
  const t=e.target;if(!S.user)return;
  if(t.dataset.skill!==undefined){S.selfSkills[t.dataset.skill]=+t.value;save();toast("Self-rating saved");return}
  if(t.dataset.ostat){S.oppStatus[t.dataset.ostat]=t.value;if(!t.value)delete S.oppStatus[t.dataset.ostat];save();render(true);toast(t.value?`Status set to ${t.value}`:"Status cleared");return}
  if(t.dataset.port){S.portfolio[t.dataset.port]=t.checked;save();toast(t.checked?"Visible on your portfolio":"Hidden from your portfolio");return}
  if(t.id==="to-portfolio"){S.portfolio[uk(itemId(...S.sel.split(",").map(Number)))]=t.checked;save();toast(t.checked?"Added to your portfolio":"Removed from your portfolio");return}
  if(t.dataset.prep){S.prep[uk(t.dataset.prep)]=t.checked;save();return}
  if(t.id==="consent"){S.consent=t.checked;save();toast(t.checked?"Preference saved. We'll ask again before sharing anything":"Preference removed");return}
});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.iq!==undefined&&S.user){S.interview[t.dataset.iq]=t.value;save()}});
document.addEventListener("submit",e=>{
  const f=e.target;if(!S.user)return;
  if(f.id==="sup-msg-form"){e.preventDefault();const v=$("#sup-msg-txt").value.trim();if(!v){toast("Write a message first");return}const k=uk("proj");(S.supMsgs[k]=S.supMsgs[k]||[]).push({me:1,t:v,at:Date.now()});
    save();toast("Message sent to your supervisor");render(true);return}
  if(f.id==="goal-form"){e.preventDefault();S.goals={role:$("#g-role").value.trim(),stage:$("#g-stage").value,interests:$("#g-int").value.trim(),grow:$("#g-grow").value.trim(),plan:$("#g-plan").value.trim()};save();toast("Career goals saved");render(true)}
  if(f.id==="post-form"){e.preventDefault();const v=$("#post-txt").value.trim();if(!v){toast("Write something before posting");return}S.posts.unshift({u:S.user,t:v,at:Date.now()});save();toast("Posted to your cohort");render(true)}
  if(f.id==="sup-form"){e.preventDefault();const sub=$("#sup-sub").value.trim(),msg=$("#sup-msg").value.trim();if(!sub||!msg){$("#sup-err").textContent="Add a subject and some details so the team can help.";return}S.support.unshift({u:S.user,cat:$("#sup-cat").value,subject:sub,msg,status:"Open",at:Date.now()});save();toast("Request sent. Track it under My requests");render(true)}
  if(f.id==="as-form"){e.preventDefault();const [wi,ii]=S.sel.split(",").map(Number),id=uk(itemId(wi,ii)),it=buildWeeks(me().track)[wi].items[ii],link=$("#as-link").value.trim(),note=$("#as-note").value.trim();
    if(!/^https?:\/\/\S+\.\S+/.test(link)){$("#as-err").textContent="Add a link that starts with https://";return}
    const re=S.reviews[id]?.status==="Revision Required";S.links[id]=link;S.done[id]=true;S.subAt[id]=Date.now();delete S.adraft[id];S.reviews[id]={note};addHist(id,it.title,re?"Resubmitted after revision":"Submitted");S.lastAct={t:it.title,at:Date.now()};save();toast(re?"Resubmitted for review":"Assignment submitted");render(true)}
});
document.addEventListener("click",e=>{if(e.target.id==="as-draft"){const id=uk(itemId(...S.sel.split(",").map(Number)));S.adraft[id]={link:$("#as-link").value.trim(),note:$("#as-note").value.trim()};save();toast("Draft saved");render(true)}});

/* ---------- round 3 handlers ---------- */
const validURL=v=>/^https?:\/\/\S+\.\S+/.test(v.trim());
function markItem(wi,i,title,note){const id=uk(itemId(wi,i));S.done[id]=true;S.subAt[id]=Date.now();addHist(id,title,note||"Submitted");S.lastAct={t:title,at:Date.now()}}
document.addEventListener("input",e=>{const t=e.target;if(!S.user)return;
  if(t.dataset.cv){const c=cvData();c[t.dataset.cv]=t.value;save();const pv=$("#cv-preview");if(pv)pv.innerHTML=cvPreview(c);const ch=atsChecks(c),sc=ch.filter(x=>x[1]).length;const l=$("#ats-list");if(l)l.innerHTML=ch.map(([x,ok])=>`<li class="${ok?"ok":""}">${ok?"✓":"○"} ${x}</li>`).join("");const pl=$("#ats-pill");if(pl){pl.textContent=`ATS check ${sc}/5`;pl.className="pill "+(sc>=4?"ok":"now")}}
  if(t.dataset.pitch){const k=uk("p");S.pitch[k]=S.pitch[k]||{};S.pitch[k][t.dataset.pitch]=t.value;save();const pt=S.pitch[k],w=[pt.a,pt.b,pt.c].join(" ").trim().split(/\s+/).filter(Boolean).length;const pc=$("#pitch-count");if(pc)pc.textContent=`${w} words · about ${Math.round(w/2.3)} seconds spoken (aim for 120–150 words)`}
});
document.addEventListener("change",e=>{const t=e.target;if(!S.user)return;
  if(t.dataset.li){S.li[uk(t.dataset.li)]=t.checked;save();return}
  if(t.dataset.app!==undefined){const a=S.apps[uk("a")][+t.dataset.app];a.st=t.value;save();toast(`Moved to ${t.value}`);render(true)}
});
document.addEventListener("submit",e=>{const f=e.target;if(!S.user)return;
  if(f.id==="out-form"){e.preventDefault();const n=$("#o-name").value.trim(),co=$("#o-co").value.trim();if(!n||!co){toast("Add the person and the company");return}
    const k=uk("o");(S.outreach[k]=S.outreach[k]||[]).push({name:n,co,ch:$("#o-ch").value,st:$("#o-st").value,on:today()});
    if(S.outreach[k].length>=10){const ws=buildWeeks(me().track),i=ws[WK.job[0]].items.findIndex(x=>x.title==="Send 10 cold outreach messages");if(!isDone(WK.job[0],i)){markItem(WK.job[0],i,"Send 10 cold outreach messages","10 messages logged");toast("10 messages sent. Task complete!")}else toast("Message logged")}else toast("Message logged");save();render(true)}
  if(f.id==="app-form"){e.preventDefault();const r=$("#a-role").value.trim(),co=$("#a-co").value.trim();if(!r||!co){toast("Add the role and the company");return}
    const k=uk("a");(S.apps[k]=S.apps[k]||[]).push({role:r,co,st:$("#a-st").value,on:today()});save();toast("Application added");render(true)}
});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t||!S.user)return;const ws=buildWeeks(me().track);
  if(t.id==="cv-submit"){const sc=atsChecks(cvData()).filter(x=>x[1]).length;if(sc<4){toast(`Your CV passes ${sc} of 5 checks. Fix at least ${4-sc} more before submitting.`);return}markItem(WK.cv,+t.dataset.i,"ATS-compliant resume","CV submitted for review");save();toast("CV submitted for review");render(true)}
  if(t.id==="li-submit"){const u=$("#li-url").value;const all=["photo","head","about","feat","skills"].every(k=>S.li[uk(k)]);if(!all){toast("Tick every item on the checklist first");return}if(!/linkedin\.com\//i.test(u)){toast("Paste your LinkedIn profile link, e.g. https://linkedin.com/in/your-name");return}S.links[uk(itemId(WK.cv,+t.dataset.i))]=u.trim();markItem(WK.cv,+t.dataset.i,"LinkedIn profile makeover","LinkedIn updated");save();toast("LinkedIn marked done");render(true)}
  if(t.id==="pf-submit"){const u=$("#pf-url").value;if(!validURL(u)){toast("Paste a link starting with https://");return}S.links[uk(itemId(WK.cv,+t.dataset.i))]=u.trim();markItem(WK.cv,+t.dataset.i,"Publish your portfolio","Portfolio published");save();toast("Portfolio published");render(true)}
  if(t.id==="pt-submit"){const u=$("#pt-link").value;if(!validURL(u)){toast("Paste a link to your recording, starting with https://");return}S.links[uk(itemId(WK.job[0],+t.dataset.i))]=u.trim();markItem(WK.job[0],+t.dataset.i,"Record your elevator pitch","Pitch submitted");save();toast("Pitch submitted");render(true)}
  if(t.id==="trk-submit"){markItem(WK.job[1],+t.dataset.i,"Weekly job application tracker",`Tracker submitted (${(S.apps[uk("a")]||[]).length} applications)`);save();toast("Tracker submitted to your coach");render(true)}
  if(t.id==="int-report"){markItem(WK.job[1],+t.dataset.i,"Report your first interview invite","Interview reported");notify("Interview reported to your coach","Your coach will reach out to help you prepare.",null);save();toast("Your coach has been notified. Congratulations!");render(true)}
});

applySettings();
render();
</script>
