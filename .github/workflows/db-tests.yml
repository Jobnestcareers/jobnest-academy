name: Database tests

on:
  push:
  workflow_dispatch:

jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Fresh database from supabase/setup.sql
        id: reset
        run: bash dev/reset_db.sh
      # The scripts build on each other's data, so they run in this order; each still runs if an earlier one has failing checks.
      - name: Applicant and staff flow
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: bash dev/test_sql.sh
      - name: Payments
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: bash dev/test_pay.sh
      - name: Student portal
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: bash dev/test_portal.sh
      - name: Timed assessment
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: bash dev/test_timer.sh
