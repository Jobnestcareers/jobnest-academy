<style>
:root{color-scheme:light}

:root{color-scheme:light}
body{background:#fff;color:#10263D}
:root{--ink:#10263D;--mut:#42536A;--bg:#fff;--soft:#F1F5F7;--tint:#E8F3F0;--line:#D8E0E6;--brand:#0F7B6C;--brand-d:#0A5A4F;--gold:#F4B740;--navy:#10263D;--c-academy:#0F7B6C;--c-community:#B4432B;--c-careers:#1F5FBF;--c-recruit:#8A5A00;--c-business:#10263D;--r:16px;--pc:#0F7B6C}

.t-academy{--pc:var(--c-academy)}.t-community{--pc:var(--c-community)}.t-careers{--pc:var(--c-careers)}.t-recruit{--pc:var(--c-recruit)}.t-business{--pc:var(--c-business)}
/* Ecosystem boards retain the existing brand palette, with a soft matching tint. */
a.card.t-academy{background:color-mix(in srgb,var(--c-academy) 5%,#fff);border-color:color-mix(in srgb,var(--c-academy) 22%,#fff)}
a.card.t-community{background:color-mix(in srgb,var(--c-community) 5%,#fff);border-color:color-mix(in srgb,var(--c-community) 22%,#fff)}

.wrap{width:100%;max-width:1216px;margin:0 auto;padding:0 32px}
.sec{padding:88px 0}.sec-soft{background:var(--soft)}.sec-tint{background:var(--tint)}
.sec-dark{background:var(--navy);color:#fff}.sec-dark .lead{color:#C9D6E2}.sec-dark .eyebrow{color:var(--gold)}
.sec-dark :focus-visible{outline-color:var(--gold)}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-d);margin-bottom:14px;display:block}
.h1{font-size:clamp(38px,5.2vw,66px)}.hero.hero-sm{padding:40px 0 28px!important}.hero.hero-md{padding:56px 0 48px!important}.hero-md .h1{font-size:clamp(32px,4.4vw,54px);max-width:20ch}.hero-md .lead{margin-top:14px}.hero-md .eyebrow{margin-bottom:12px}.hero-sm .h1{font-size:clamp(28px,3.4vw,40px);max-width:none}.hero-sm .lead{margin-top:10px;font-size:18px}.hero-sm .eyebrow{margin-bottom:10px}.h2{font-size:clamp(30px,3.6vw,44px)}.h3{font-size:clamp(22px,2vw,26px)}

.form[data-fid="updates-academy"] .btn-p:hover{background:var(--brand-d)}

.form[data-fid="updates-careers"] .btn-p:hover,
.form[data-fid="apply"] .btn-p:hover{background:var(--c-careers)}
.form[data-fid="recruit"] .btn-p{background:var(--c-recruit);color:#fff}

.btn-row{display:flex;flex-wrap:wrap;gap:14px}

.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}

/* nav */
.nav{background:#fff;border-bottom:1px solid var(--line)}

.logo{display:inline-flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:25px;letter-spacing:-.02em;text-decoration:none;color:var(--ink);min-height:44px}

.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:10px;font:500 16px 'DM Sans',sans-serif;color:var(--ink);text-decoration:none;background:none;border:0;cursor:pointer}
.nav-link:hover{background:var(--soft)}.nav-link.on{color:var(--brand-d);font-weight:700}

.pb-link{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;color:var(--ink)}

.pb-link i{width:9px;height:9px;border-radius:50%;background:var(--pc);display:inline-block}.pb-link.on i{background:#fff}

.hero{background:var(--tint);padding:72px 0 88px}

.path{background:#fff;border-radius:24px;padding:12px;border:1px solid #BFDDD6;box-shadow:0 18px 40px rgba(16,38,61,.1)}

/* flow, steps */
.flow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}

.jn input[type=text],.jn input[type=email],.jn select,.jn textarea{font:400 17px 'DM Sans',sans-serif;min-height:52px;padding:12px 14px;border:1.5px solid #7B8DA1;border-radius:10px;background:#fff;color:var(--ink);width:100%}
.jn textarea{min-height:124px;resize:vertical}
.jn input[type=text]:focus,.jn input[type=email]:focus,.jn select:focus,.jn textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(15,123,108,.2)}
.jn [aria-invalid="true"]{border-color:#B4231A!important;background:#FFF7F6}
.err{color:#B4231A;font-size:15px;font-weight:500}
.hint{font-size:14.5px;color:var(--mut)}
.alert{display:flex;gap:12px;padding:16px 18px;border-radius:12px;border:1px solid;align-items:flex-start;margin-bottom:22px}
.alert svg{width:22px;height:22px;flex:none;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.alert-err{background:#FFF1EF;border-color:#E6A39B;color:#7A1710}
.alert-warn{background:#FFF8E5;border-color:#E8C26A;color:#5E4300}
.alert-ok{background:#E7F5F1;border-color:#9BD0C4;color:#0A4A41}
.sim{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--mut);border:1px dashed #8FA0B3;border-radius:10px;padding:10px 14px}
.sim input{width:20px;height:20px;accent-color:var(--brand)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:jspin .8s linear infinite}
@keyframes jspin{to{transform:rotate(360deg)}}
.success{display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:12px 0}
.success .tick{width:60px;height:60px;border-radius:50%;background:var(--tint);color:var(--brand-d);display:grid;place-items:center}
.success .tick svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
@media(max-width:800px){.filters{grid-template-columns:1fr}}
.opp{display:flex;flex-direction:column;gap:16px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px}
.opp dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px 20px;margin:0}
.opp dt{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.opp dd{margin:0}
.foot{background:var(--navy);color:#E8EEF3;padding:64px 0 28px;font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
.foot,.foot *{box-sizing:border-box}
.foot-grid{display:grid;grid-template-columns:1.6fr repeat(4,minmax(0,1fr));gap:36px}
@media(max-width:1000px){.foot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.foot-grid{grid-template-columns:1fr}}
.foot h4{font:600 13px 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#9FB3C8;margin:0 0 12px}
.foot ul{list-style:none;margin:0;padding:0}
.foot a{color:#E8EEF3;text-decoration:none;display:inline-block;padding:7px 0;min-height:36px}
.foot a:hover{text-decoration:underline}.foot a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.foot .dim{color:#9FB3C8;display:inline-block;padding:7px 0}
.foot .logo{color:#fff;display:inline-flex;align-items:center;gap:10px;padding:0;min-height:44px}.foot p{margin:0}
@media(min-width:1001px){.steps5{grid-template-columns:repeat(5,minmax(0,1fr))}}
.foot-base{border-top:1px solid #2B4561;margin-top:44px;padding-top:22px;color:#9FB3C8;font-size:14.5px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.more h2{font-size:clamp(26px,3vw,36px)}
.acad-band{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--navy);color:#fff;border-radius:28px;padding:48px}
.acad-band-l{display:flex;flex-direction:column;gap:16px;align-items:flex-start}.acad-band .lead{color:#C9D6E2}
.acad-feat{display:flex;flex-direction:column;gap:10px;background:#fff;color:var(--ink);border-radius:20px;padding:28px;text-decoration:none;transition:transform .18s,box-shadow .18s}
.acad-feat:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.25)}
.acad-feat strong{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;line-height:1.15;color:var(--ink)}
@media(max-width:860px){.acad-band{grid-template-columns:1fr;padding:28px 20px;border-radius:20px}}

.wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
@media(max-width:860px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.pg p+p{margin-top:16px}
.card.tm{display:flex;flex-direction:row;gap:18px;align-items:center;text-align:left;padding:20px}.tm>div{min-width:0}
.tm h3{margin:0 0 4px}.tm p{margin:0;color:var(--mut)}
.photo{position:relative;flex:none;width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--tint);display:grid;place-items:center;border:2px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.av{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:26px;color:var(--brand-d)}
.cam{position:absolute;right:2px;bottom:2px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:16px;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fi{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo:focus-within{outline:3px solid var(--gold);outline-offset:2px}
body{margin:0}
.jn a.btn-p{color:#fff}
.opp dl>*,.opp dd,.opp dt{min-width:0;overflow-wrap:anywhere}
.chips{max-width:100%}.chip{max-width:100%;white-space:normal}
@media(max-width:560px){
.btn-row{flex-direction:column;align-items:stretch}
.btn-row .btn{width:100%;justify-content:center;text-align:center}
.card.tm{padding:16px;gap:14px}.photo{width:72px;height:72px}
.cta-band{padding:32px 20px}
}

/* audit fixes */
.jn a.btn-g{color:var(--navy)}
.sec-dark .card h3,.sec-dark .card .h3{color:var(--ink)}
.sec-dark .card p{color:var(--mut)}
figcaption .ico{color:var(--ink)}
.jn a.btn-p{color:#fff}
.crumbs a{display:inline-block;padding:10px 2px;margin:-10px 0}
.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;padding:12px 18px;z-index:100;border-radius:0 0 8px 0;font-weight:600}
.skip:focus{left:0}
#main:focus{outline:none}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:24px 16px;list-style:none;padding:0;margin:0}
.strip li{text-align:center}.strip img{width:104px;height:104px;max-width:100%;border-radius:50%;object-fit:cover;border:2px solid var(--line);margin:0 auto 12px;display:block}
.strip b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;color:var(--ink)}.strip span{display:block;font-size:14px;line-height:1.4;color:var(--mut);margin-top:2px}
@media(max-width:900px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:520px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.strip img{width:88px;height:88px}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero-grid>div:first-child>*{animation:rise .7s ease both}.hero-grid>div:first-child>*:nth-child(2){animation-delay:.08s}.hero-grid>div:first-child>*:nth-child(3){animation-delay:.16s}.hero-grid>div:first-child>*:nth-child(4){animation-delay:.24s}.hero-grid>div:first-child>*:nth-child(5){animation-delay:.32s}
#stories figure{animation:fadein .5s ease both}
html.js-rv .rv{transition:opacity .65s ease,transform .65s ease}html.js-rv .rv:not(.in){opacity:0;transform:translateY(24px)}
@media print{html.js-rv .rv:not(.in){opacity:1!important;transform:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

function btn(label, to, cls, st, arrow) {
  cls = cls || 'btn-p';

  if (to.charAt(0) === '!') return '<a class="btn ' + cls + '" href="#" data-act="modal" data-arg="' + to.slice(1) + '" style="' + (st || '') + '">' + label + (arrow ? AR : '') + '</a>';

}

function apprHTML() {
  return '<div role="group" aria-label="Our approach" style="display:flex;flex-direction:column;gap:12px">' + APPR.map(function (a, i) {
    var on = i === S.appr;
    return '<button type="button" class="card" aria-pressed="' + on + '" data-act="appr" data-arg="' + i + '" style="cursor:pointer;text-align:left;font-family:inherit;' + (on ? 'border-color:#0F7B6C;box-shadow:0 0 0 3px rgba(15,123,108,.25);' : '') + '"><span style="display:flex;gap:16px;align-items:center"><span class="tl-n" style="flex:none;' + (on ? '' : 'background:#10263D;') + '">' + (i + 1) + '</span><span style="font-family:\'Bricolage Grotesque\',sans-serif;font-weight:700;font-size:26px;color:inherit">' + a[0] + '</span></span></button>';
  }).join('') + '</div><div class="card" style="background:var(--navy);color:#fff;justify-content:center;padding:40px" aria-live="polite"><span class="eyebrow" style="color:var(--gold);margin:0">' + APPR[S.appr][0] + '</span><p class="h2" style="font-family:\'Bricolage Grotesque\',sans-serif;color:#fff">' + APPR[S.appr][1] + '</p></div>';

function teamHTML() {
  return TEAM.map(function (m, i) {
    var ini = m[0].split(' ').map(function (w) { return w[0]; }).slice(0, 2).join(''), url = TEAMPH[i];
    return '<li class="card tm"><div class="photo">' + (url ? '<img src="' + url + '" alt="Photo of ' + m[0] + '" width="84" height="84">' : '<span class="av" aria-hidden="true">' + ini + '</span>') + '</div><div><h3 style="font-size:22px">' + m[0] + '</h3><p>' + m[1] + '</p></div></li>';

}
function about() {
  return pageHead({ crumbs: [['Home', 'home'], ['About Us']], eyebrow: 'About Us', h1: 'Helping people build careers they are proud of.', compact: 'md' }) +
    wrapSec('<div class="two"><div><span class="eyebrow">Our story</span><h2 class="h2">Why Jobnest Exists</h2></div><div class="pg"><p class="h3" style="margin-bottom:20px">A degree alone doesn\'t get you hired.</p><p class="mut">Many graduates don\'t know which path fits, or how to show what they can do. Employers struggle to find people who are ready.</p><p><b>Jobnest bridges that gap</b>, with learning, community, opportunities and hiring in one place.</p></div></div>', '', '', 'story') +
    wrapSec('<div class="sec-head"><span class="eyebrow">Our approach</span><h2 class="h2">Learn. Build. Connect. Grow.</h2></div><div class="two" id="appr" style="gap:32px;align-items:stretch">' + apprHTML() + '</div>', 'sec-soft', '', 'approach') +
    wrapSec('<div class="two"><div><span class="eyebrow">Our mission</span><p class="h2" style="font-family:\'Bricolage Grotesque\',sans-serif">To help people become employable and build careers they are proud of.</p></div><div><span class="eyebrow">Our vision</span><p class="h2" style="font-family:\'Bricolage Grotesque\',sans-serif">To build a trusted career ecosystem that helps people develop professionally and connects talent with opportunities.</p></div></div>', 'sec-dark') +
    wrapSec('<div class="two" style="grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);align-items:center"><figure style="margin:0;max-width:100%"><img src="' + FOUNDER + '" alt="Portrait of Shekemi Odeyemi, Founder and CEO of Jobnest" width="760" height="760" style="width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:center 20%;border-radius:24px;display:block"></figure><div class="pg"><span class="eyebrow">About the founder</span><h2 class="h2">Meet the Founder</h2><p style="margin-top:22px"><b style="font-size:20px">Shekemi Odeyemi</b><br><span class="mut">Founder &amp; CEO, Jobnest</span></p><p class="mut" style="margin-top:22px">With a background in Statistics and experience across operations and talent, Shekemi saw the gap between what people learn and what the workplace needs.</p><p class="h3" style="margin:20px 0;color:var(--brand-d)">How can we make the journey from potential to opportunity more practical?</p><p>Jobnest is her answer.</p><div class="btn-row" style="margin-top:28px">' + btn('Get in touch', 'contact') + '</div></div></div>', '', '', 'founder') +
    wrapSec(sechead('Our team', 'The People Behind Jobnest') + '<ul class="grid g3" id="team-list">' + teamHTML() + '</ul>', 'sec-soft', '', 'team') +
    wrapSec('<div class="two" style="align-items:start"><div class="pg"><h2 class="h2">Be Part of Jobnest</h2><p class="lead" style="margin-top:22px">Volunteer, collaborate on a project, or tell us how you\'d like to help.</p></div><div class="card" style="gap:18px;padding:32px"><div class="btn-row"><button class="btn btn-p" type="button" data-act="modal" data-arg="join">Join the Jobnest Team</button></div><p class="hint">Submitting the form expresses interest in contributing to Jobnest. It does not guarantee employment, immediate placement, payment or a future paid role.</p></div></div>', '', '', 'join') +
    wrapSec(sechead('What we believe', 'The ideas behind everything we build.') + '<div class="grid g3">' + ['Practical skills matter.', 'Everyone deserves access to meaningful career opportunities.', 'Learning should lead to action.', 'Experience helps people build confidence.', 'Careers are built over time.', 'Talent and opportunity should connect more effectively.'].map(function (t) { return '<div class="card"><h3>' + t + '</h3></div>'; }).join('') + '</div>', 'sec-soft') +
    wrapSec('<div class="cta-band"><span class="eyebrow" style="color:var(--gold);margin:0">Start your journey</span><h2 class="h2">There\'s a place for you at Jobnest.</h2><div class="btn-row">' + btn('Explore Jobnest', 'explore', 'btn-g') + btn('Get Started', 'start', 'btn-o') + '</div></div>', '', 'padding-top:0');
}

var PRIV = '<h2 class="h3" style="margin:34px 0 10px">Who we are</h2><p>This website (jobnestcareers.com) is run by Jobnest Services, trading as Jobnest. In this policy, “Jobnest”, “we” and “us” mean Jobnest Services. Contact us at info@jobnestcareers.com.</p><h2 class="h3" style="margin:34px 0 10px">What we collect</h2><p>Only what you choose to send us through our forms: your name, email address, phone number, and the details you add in a message, hiring request, business enquiry or programme or opportunity update sign-up (for example your organisation, role, location or experience level). We do not ask for payment details on this website.</p><h2 class="h3" style="margin:34px 0 10px">How we use it</h2><p>To reply to your enquiry, to send the updates you asked for, to understand hiring and business needs, and to improve Jobnest. We will not sell your personal data.</p><h2 class="h3" style="margin:34px 0 10px">How form data is handled</h2><p>Form submissions are received through our website host, Netlify, and delivered to the Jobnest team. A hidden spam-trap field is used to filter automated submissions. Submissions are stored in our Netlify account and delivered to the Jobnest team by email.</p><h2 class="h3" style="margin:34px 0 10px">Who can see it</h2><p>Jobnest team members who need it to respond. We may share details with service providers who help us run the website and communications, under appropriate safeguards. We may disclose information where the law requires it.</p><h2 class="h3" style="margin:34px 0 10px">How long we keep it</h2><p>Only as long as needed for the purpose you gave it, or as the law requires. We keep newsletter and waitlist sign-ups until you ask to be removed, and other enquiries for up to 12 months.</p><h2 class="h3" style="margin:34px 0 10px">Your rights</h2><p>You can ask us to access, correct or delete your personal data, to stop sending you updates, or to restrict how we use it, and you can complain to the relevant data protection authority (in Nigeria, the Nigeria Data Protection Commission). Email info@jobnestcareers.com to make a request.</p><h2 class="h3" style="margin:34px 0 10px">Cookies and analytics</h2><p>The site does not currently set tracking cookies. If we add analytics or cookies in future, we will update this policy first.</p><h2 class="h3" style="margin:34px 0 10px">Changes</h2><p>We may update this policy and will change the date below when we do.</p>';
var TERMS = '<h2 class="h3" style="margin:34px 0 10px">About these terms</h2><p>By using this website you agree to these terms. If you do not agree, please do not use it. The website (jobnestcareers.com) is operated by Jobnest Services, trading as Jobnest.</p><h2 class="h3" style="margin:34px 0 10px">What the site offers</h2><p>Information about Jobnest Academy, Community, Careers, Recruit and For Business, and ways to contact us or register interest. Some programmes and services are in development. Where a page says content is coming soon or to be confirmed, it is not yet an offer.</p><h2 class="h3" style="margin:34px 0 10px">No guarantee of outcomes</h2><p>Jobnest helps people develop skills and connect with opportunities, but we do not guarantee employment, interviews, placements or any particular result. Listings and programme details can change or close.</p><h2 class="h3" style="margin:34px 0 10px">Opportunities and third parties</h2><p>Where we share opportunities from employers or partners, applications may be handled by those third parties under their own terms. Please check details before you apply.</p><h2 class="h3" style="margin:34px 0 10px">Your use of the site</h2><p>Use the site lawfully. Give accurate information in forms. Do not try to disrupt the site, send spam, or misuse other people\'s information.</p><h2 class="h3" style="margin:34px 0 10px">Intellectual property</h2><p>The Jobnest name, logo, text and design belong to Jobnest or its licensors. You may view the site for personal use and share links to it, but may not copy or reuse content without permission.</p><h2 class="h3" style="margin:34px 0 10px">Liability</h2><p>We work to keep information accurate and the site available, but provide them as they are. To the extent the law allows, Jobnest is not liable for losses arising from use of the site or reliance on its content.</p><h2 class="h3" style="margin:34px 0 10px">Governing law</h2><p>These terms are governed by the laws of the Federal Republic of Nigeria.</p><h2 class="h3" style="margin:34px 0 10px">Changes and contact</h2><p>We may update these terms and will change the date below when we do. Questions: info@jobnestcareers.com.</p>';
function privacy() { return legalPage('privacy'); }
function terms() { return legalPage('terms'); }

/* ---------- router ---------- */
var ROUTES = {
  privacy: { t: 'Privacy Policy', f: privacy }, terms: { t: 'Terms of Use', f: terms },
  home: { t: 'Jobnest', a: 'home', f: home }, explore: { t: 'Explore Jobnest', a: 'explore', f: explore }, start: { t: 'Get Started', a: 'start', f: start },
  academy: { t: 'Jobnest Academy', p: 'academy', f: academy },
  community: { t: 'Jobnest Community', p: 'community', f: community }, careers: { t: 'Jobnest Careers', p: 'careers', f: careers }, opportunities: { t: 'Current Opportunities', p: 'careers', f: opportunities }, opportunity: { t: 'Opportunity Details', p: 'careers', f: opportunity },
  recruit: { t: 'Jobnest Recruit', p: 'recruit', f: recruit }, business: { t: 'Jobnest for Business', p: 'business', f: business }, about: { t: 'About Jobnest', a: 'about', f: about }, contact: { t: 'Contact Jobnest', a: 'contact', f: contact }
};
var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches), IO = null, TK = 0;
function motion() {
  if (IO) { IO.disconnect(); IO = null; }
  if (RM || !('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('js-rv');
  IO = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); IO.unobserve(e.target); } }); }, { threshold: 0.06, rootMargin: '0px 0px -5% 0px' });
  document.querySelectorAll('#main > section.sec').forEach(function (s) { s.classList.add('rv'); IO.observe(s); });
}
setInterval(function () {
  if (RM || document.hidden) return;
  TK++;
  if (TK % 4 === 0 && !S.storyLock) {
    var st = document.getElementById('stories');
    if (st && !st.matches(':hover') && !st.contains(document.activeElement)) {
      var n = st.querySelectorAll('[data-act="story"]').length;
      if (n) { S.story = (S.story + 1) % n; st.innerHTML = stories(); }
    }
  }
}, 1800);
function route() {
  closeModal(true);
  var key = (location.hash || '').replace(/^#\/?/, '') || 'home', r = ROUTES[key];
  /* Listing template is hidden until real opportunities exist */
  if (key === 'opportunity') { location.replace('#opportunities'); return; }
  /* Programme pages moved to the Jobnest Academy site. Old links land on the Academy page, at the programmes section. */
  if (key === 'programmes' || key === 'gep') { location.replace('#academy'); setTimeout(function () { var el = document.getElementById('programmes'); if (el) el.scrollIntoView(); }, 80); return; }
  if (!r) { var t = document.getElementById(key); if (t) { t.scrollIntoView(); return; } key = 'home'; r = ROUTES.home; }
  CUR = { active: r.a || '', pillar: r.p || '' };
  S.menu = false; S.mob = false; S.mobx = false;
  S.forms = {};
  document.title = r.t;
  renderNav();
  $('#main').innerHTML = r.f();
  $('#foot').innerHTML = footHTML();
  window.scrollTo(0, 0);
  var mn = $('#main'); if (mn && mn.focus) { try { mn.focus({ preventScroll: true }); } catch (x) {} }
  motion();
}
function act(a, arg) {
  if (a === 'menu') { S.menu = !S.menu; renderNav(); }
  else if (a === 'mob') { S.mob = !S.mob; renderNav(); }
  else if (a === 'mobx') { S.mobx = !S.mobx; renderNav(); }
  else if (a === 'story') { S.storyLock = true; S.story = +arg; $('#stories').innerHTML = stories(); }
  else if (a === 'appr') { S.appr = +arg; $('#appr').innerHTML = apprHTML(); }
  else if (a === 'otype') { S.otype = arg; renderOpps(); }
  else if (a === 'oclear') { S.otype = 'All'; S.okw = ''; var k = $('#o-kw'); if (k) k.value = ''; renderOpps(); }
  else if (a === 'reveal') {
    var box = $('#reveal-' + arg), rb = document.querySelector('[data-act="reveal"][data-arg="' + arg + '"]');
    if (box) {
      if (box.innerHTML) { box.innerHTML = ''; if (rb) rb.setAttribute('aria-expanded', 'false'); }
      else {
        box.innerHTML = form(arg); if (rb) rb.setAttribute('aria-expanded', 'true');
        box.scrollIntoView({ behavior: 'smooth', block: 'start' });
        var first = box.querySelector('input,select,textarea'); if (first) { try { first.focus({ preventScroll: true }); } catch (x) {} }
      }
    }
  }
  else if (a === 'modal') { openModal(arg); }
  else if (a === 'mclose') { closeModal(); }
  else if (a === 'again') { S.forms[arg] = ''; renderForm(arg); }
}
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.modal) { closeModal(); return; }
  if (e.key === 'Tab' && S.modal) {
    var f = [].slice.call(document.querySelectorAll('#fmodal button,#fmodal input:not([type=hidden]),#fmodal select,#fmodal textarea,#fmodal a[href]'));
    if (f.length && e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (f.length && !e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  if (e.key !== 'Escape' || !(S.menu || S.mob)) return;
  var t = S.menu ? '[data-act="menu"]' : '[data-act="mob"]';
  S.menu = false; S.mob = false; S.mobx = false; renderNav();
  var b = $(t); if (b) b.focus();
});
document.addEventListener('click', function (e) {
  if (S.menu && !e.target.closest('.nav')) { S.menu = false; renderNav(); }
  var sc = e.target.closest('[data-scroll]');
  if (sc) {
    e.preventDefault();
    var g = sc.getAttribute('data-goto');
    var go = function () { var el = document.getElementById(sc.getAttribute('data-scroll')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    if (g) { location.hash = '#' + g; setTimeout(go, 60); } else go();
    return;
  }
  var a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); act(a.getAttribute('data-act'), a.getAttribute('data-arg')); }
});
document.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target;
  if (f.getAttribute('data-fid')) submitForm(f);
  else if (f.id === 'oppform') { S.okw = f.elements.kw.value.trim(); renderOpps(); }
});
window.addEventListener('hashchange', route);
route();
})();
